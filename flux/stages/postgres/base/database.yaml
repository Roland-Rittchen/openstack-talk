apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: database-backups
  namespace: demo
spec:
  configuration:
    destinationPath: s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}
    endpointURL: ${BACKUP_S3_ENDPOINT}
    endpointCA:
      name: database-backup-ca
      key: ca.crt
    s3Credentials:
      accessKeyId: {name: database-backup-credentials, key: ACCESS_KEY_ID}
      secretAccessKey: {name: database-backup-credentials, key: ACCESS_SECRET_KEY}
      region: {name: database-backup-credentials, key: AWS_REGION}
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-db
  namespace: demo
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ${POSTGRES_IMAGE}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: demo
      owner: demo
  storage:
    size: 2Gi
    storageClass: ${STORAGE_CLASS}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  affinity:
    podAntiAffinityType: preferred
  postgresql:
    parameters:
      archive_timeout: 60s
      max_wal_size: 512MB
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: database-backups
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: demo-db-daily
  namespace: demo
spec:
  schedule: '0 0 1 * * *'
  suspend: true
  backupOwnerReference: self
  cluster:
    name: demo-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
