# Render only GIT_REPOSITORY_URL, GIT_BRANCH and ENVIRONMENT before applying.
# Apply platform-runtime and the selected environment's platform-values first.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  url: ${GIT_REPOSITORY_URL}
  ref:
    branch: ${GIT_BRANCH}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-operators
  namespace: flux-system
spec:
  interval: 5m
  path: ./bootstrap/kubernetes
  prune: false
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: platform}
  postBuild:
    substituteFrom:
      - {kind: ConfigMap, name: platform-runtime}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  # Start with SQLite. Switch to ./flux/stages/postgres/clusters/${ENVIRONMENT}
  # only after creating the backup/pull secrets and reviewing data migration.
  path: ./flux/clusters/${ENVIRONMENT}
  dependsOn:
    - name: database-operators
  prune: false
  wait: true
  timeout: 10m
  sourceRef: {kind: GitRepository, name: platform}
  postBuild:
    substituteFrom:
      - {kind: ConfigMap, name: platform-runtime}
      - {kind: ConfigMap, name: platform-values}
