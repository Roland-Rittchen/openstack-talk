# Management cluster only. Render GIT_REPOSITORY_URL, GIT_BRANCH, ENVIRONMENT.
# Create capi-${ENVIRONMENT}, its cloud-config Secret and capi-values first.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: capi
  namespace: flux-system
spec:
  interval: 1m
  url: ${GIT_REPOSITORY_URL}
  ref:
    branch: ${GIT_BRANCH}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-${ENVIRONMENT}
  namespace: flux-system
spec:
  interval: 1m
  path: ./capi/overlays/${ENVIRONMENT}
  targetNamespace: capi-${ENVIRONMENT}
  prune: false
  wait: false
  sourceRef: {kind: GitRepository, name: capi}
  postBuild:
    substituteFrom:
      - {kind: ConfigMap, name: capi-values}
