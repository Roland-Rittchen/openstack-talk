# Firewall only: Flannel owns pod transport and kube-proxy owns Services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-policy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-policy
rules:
  - apiGroups: ['']
    resources: [namespaces, pods, nodes, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-policy
subjects:
  - kind: ServiceAccount
    name: network-policy
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-policy
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: network-policy}
  template:
    metadata:
      labels: {app: network-policy}
    spec:
      serviceAccountName: network-policy
      priorityClassName: system-node-critical
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: controller
          image: docker.io/cloudnativelabs/kube-router:v2.11.1
          args:
            - --run-router=false
            - --run-service-proxy=false
            - --run-firewall=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          securityContext: {privileged: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 20244}
          livenessProbe:
            httpGet: {path: /healthz, port: 20244}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: modules, mountPath: /lib/modules, readOnly: true}
            - {name: xtables-lock, mountPath: /run/xtables.lock}
      volumes:
        - name: modules
          hostPath: {path: /lib/modules, type: Directory}
        - name: xtables-lock
          hostPath: {path: /run/xtables.lock, type: FileOrCreate}
