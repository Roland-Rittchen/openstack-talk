apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 1h
  url: ${DATABASE_CHART_REPOSITORY}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: certificates
  namespace: flux-system
spec:
  interval: 1h
  url: ${CERT_MANAGER_CHART_REPOSITORY}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: certificates
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      version: ${CERT_MANAGER_CHART_VERSION}
      sourceRef:
        kind: HelmRepository
        name: certificates
        namespace: flux-system
  values:
    crds:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: database
  namespace: cnpg-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: ${DATABASE_OPERATOR_CHART_VERSION}
      sourceRef:
        kind: HelmRepository
        name: database
        namespace: flux-system
  values:
    fullnameOverride: cnpg-controller-manager
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: database-backups
  namespace: cnpg-system
spec:
  interval: 5m
  dependsOn:
    - name: certificates
      namespace: cert-manager
    - name: database
  chart:
    spec:
      chart: plugin-barman-cloud
      version: ${DATABASE_PLUGIN_CHART_VERSION}
      sourceRef:
        kind: HelmRepository
        name: database
        namespace: flux-system
  values:
    fullnameOverride: plugin-barman-cloud
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
