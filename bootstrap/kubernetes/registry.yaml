apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-registry
  namespace: flux-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-registry
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-registry
  template:
    metadata:
      labels:
        app: platform-registry
    spec:
      containers:
        - name: registry
          image: ${REGISTRY_IMAGE}
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: platform
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: registry
          livenessProbe:
            tcpSocket:
              port: registry
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-registry
        - name: auth
          secret:
            secretName: platform-registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: platform-registry
  namespace: flux-system
spec:
  selector:
    app: platform-registry
  ports:
    - port: 5000
      targetPort: registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-registry
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: platform-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: source-controller
      ports:
        - protocol: TCP
          port: 5000
